[project]
name = "abridged-convert"
version = "0.1.0"
description = "Convert abridged Series, Shots, Shorts, and Songs entries into mirrored MP4 outputs."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
abridged-convert = "abridged_convert.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abridged_convert"]

[tool.pytest.ini_options]
python_classes = ["*Tests"]
pythonpath = ["src"]
